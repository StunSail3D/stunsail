[project]
name = "stunsail-api"
version = "0.1.0"
description = "StunSail versioned HTTP API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "stunsail-core",
  "stunsail-cost-engine",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
stunsail-core = { workspace = true }
stunsail-cost-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
